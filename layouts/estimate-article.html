{{ define "main" }}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&display=swap">
<style>
.st-estimate{--st-ink:#292d29;--st-muted:#687169;--st-paper:#f7f5ef;--st-rule:#dce0d9;--st-accent:#52776b;max-width:760px;margin:0 auto;padding:4rem 1.5rem 6rem;color:var(--st-ink);font-size:1.05rem;line-height:1.85}.dark .st-estimate{--st-ink:#e7e9e4;--st-muted:#aab3aa;--st-paper:#272b28;--st-rule:#434a43;--st-accent:#a3c8b5}.st-estimate .st-kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--st-muted);margin:0 0 1.3rem}.st-estimate h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;letter-spacing:-.035em;font-weight:600;margin:0 0 1.3rem}.st-estimate .st-deck{color:var(--st-muted);font-size:1.15rem;line-height:1.65;margin-bottom:2rem}.st-estimate .st-meta{font-size:.8rem;color:var(--st-muted);margin-bottom:3rem}.st-estimate .st-body{max-width:100%}.st-estimate .st-body p{margin:0 0 1.4rem;text-align:justify;hyphens:auto}.st-estimate .st-body h2{font-size:1.55rem;line-height:1.3;font-weight:600;letter-spacing:-.02em;margin:3.4rem 0 1.2rem}.st-estimate .st-body h3{font-size:1.15rem;font-weight:600;margin:2.2rem 0 1rem}.st-estimate .st-body a{color:var(--st-accent);text-decoration:underline;text-underline-offset:3px}.st-estimate .st-body strong{font-weight:700}.st-estimate .st-notebook{background-color:var(--st-paper);background-image:radial-gradient(var(--st-rule) .7px,transparent .7px);background-size:13px 13px;border-radius:5px;padding:1.7rem 2rem;margin:2.3rem 0;overflow-x:auto}.st-estimate .st-notebook .st-math{font-family:'Annie Use Your Telescope',cursive;font-size:clamp(1.45rem,3.5vw,1.9rem);line-height:1.5;letter-spacing:.01em;margin:0;white-space:pre-wrap;text-align:left;hyphens:none}.st-estimate .st-notebook .st-math strong{font-weight:400;border-bottom:1.5px solid currentColor}.st-estimate .st-notebook .st-caption{font-size:.75rem;line-height:1.5;color:var(--st-muted);margin:.8rem 0 0;text-align:left}.st-estimate .st-annotation{font-family:'Annie Use Your Telescope',cursive;font-size:1.35rem;line-height:1.4;color:var(--st-muted);margin:1.2rem 0}.st-estimate figure{margin:2.5rem 0}.st-estimate figure img{width:100%;height:auto;display:block}.st-estimate figcaption{font-size:.78rem;line-height:1.5;color:var(--st-muted);margin-top:.7rem}.st-estimate .st-table-wrap{overflow-x:auto;margin:2rem 0}.st-estimate table{width:100%;border-collapse:collapse;font-size:.86rem;line-height:1.5}.st-estimate th,.st-estimate td{padding:.75rem .6rem;border-bottom:1px solid var(--st-rule);text-align:right;white-space:nowrap}.st-estimate th:first-child,.st-estimate td:first-child{text-align:left}.st-estimate th{font-weight:600}.st-estimate .st-notes{border-top:1px solid var(--st-rule);padding-top:1.8rem;margin-top:4rem}.st-estimate .st-sources{font-size:.84rem;line-height:1.7;color:var(--st-muted)}.st-estimate .st-sources p{text-align:left;margin-bottom:1rem;overflow-wrap:anywhere}.st-estimate .st-sources h3{color:var(--st-ink)}@media(max-width:640px){.st-estimate{padding:2.5rem 1.2rem 4rem;font-size:1rem}.st-estimate .st-notebook{padding:1.2rem}.st-estimate .st-body h2{margin-top:2.8rem}.st-estimate .st-body p{text-align:justify}}
</style>
<article class="st-estimate">
  <p class="st-kicker"><a href="{{ "categories/estimates/" | relLangURL }}">Estimates</a> / Samal Thinks</p>
  <header><h1>{{ .Title }}</h1>{{ with .Description }}<p class="st-deck">{{ . }}</p>{{ end }}<p class="st-meta">{{ .Date.Format "2 January 2006" }} · {{ .ReadingTime }} min read</p></header>
  <div class="st-body">{{ .Content }}</div>
</article>
{{ end }}
