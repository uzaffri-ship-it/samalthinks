<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="title desc"><title id="title">White car colour estimates in India</title><desc id="desc">BASF 2024: 49 percent. Axalta 2025: 33 percent. Working midpoint: 41 percent.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#292d29}.label{font-size:15px}.value{font-size:18px;font-weight:600}.small{font-size:11px;fill:#687169}</style><rect width="720" height="290" fill="#fff"/><text x="0" y="22" font-size="15" font-weight="600">White, according to two colour reports</text><text x="0" y="44" class="small">India · percentage of reported automotive colour popularity</text><g transform="translate(0 72)"><text x="0" y="14" class="label">BASF 2024</text><rect x="170" y="0" width="441" height="24" rx="2" fill="#dce4df"/><text x="626" y="18" class="value">49%</text><text x="0" y="72" class="label">Axalta 2025</text><rect x="170" y="58" width="297" height="24" rx="2" fill="#a9bdb2"/><text x="482" y="76" class="value">33%</text><line x1="170" y1="120" x2="620" y2="120" stroke="#dce0d9"/><text x="0" y="154" class="label">Working midpoint</text><rect x="170" y="138" width="369" height="24" rx="2" fill="#52776b"/><text x="554" y="156" class="value">41%</text></g><text x="0" y="273" class="small">Different reports and methodologies. Midpoint is a modelling choice, not a pooled estimate.</text></svg>