<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">India new passenger vehicle fuel mix, 2024 and 2025</title><desc id="desc">Petrol 59.44 to 53.27 percent; diesel 17.93 to 18.33; CNG 17.76 to 21.15; EV 2.55 to 4.61; hybrid 2.32 to 2.64.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#292d29}.label{font-size:14px}.small{font-size:11px;fill:#687169}.value{font-size:13px;font-weight:600}</style><rect width="720" height="350" fill="#fff"/><text x="0" y="22" font-size="15" font-weight="600">New passenger-vehicle sales by fuel</text><text x="0" y="44" class="small">India · share of annual sales, not existing fleet</text><rect x="0" y="65" width="12" height="12" fill="#dce4df"/><text x="19" y="75" class="small">2024</text><rect x="90" y="65" width="12" height="12" fill="#52776b"/><text x="109" y="75" class="small">2025</text><g transform="translate(0 100)"><text y="15" class="label">Petrol</text><rect x="120" width="416" height="15" rx="2" fill="#dce4df"/><rect x="120" y="19" width="372.9" height="15" rx="2" fill="#52776b"/><text x="548" y="13" class="value">59.44%</text><text x="505" y="32" class="value">53.27%</text><text y="65" class="label">Diesel</text><rect x="120" y="50" width="125.5" height="15" rx="2" fill="#dce4df"/><rect x="120" y="69" width="128.3" height="15" rx="2" fill="#52776b"/><text x="258" y="63" class="value">17.93%</text><text x="261" y="82" class="value">18.33%</text><text y="115" class="label">CNG</text><rect x="120" y="100" width="124.3" height="15" rx="2" fill="#dce4df"/><rect x="120" y="119" width="148.1" height="15" rx="2" fill="#52776b"/><text x="257" y="113" class="value">17.76%</text><text x="281" y="132" class="value">21.15%</text><text y="165" class="label">EV</text><rect x="120" y="150" width="17.85" height="15" rx="2" fill="#dce4df"/><rect x="120" y="169" width="32.27" height="15" rx="2" fill="#52776b"/><text x="165" y="163" class="value">2.55%</text><text x="165" y="182" class="value">4.61%</text></g><text x="0" y="334" class="small">Hybrid: 2.32% in 2024 and 2.64% in 2025. Source: Autocar India, 4 January 2026.</text></svg>