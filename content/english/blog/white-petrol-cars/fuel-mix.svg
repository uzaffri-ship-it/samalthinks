<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">India new passenger vehicle fuel mix, 2024 and 2025</title><desc id="desc">Petrol 59.44 to 53.27 percent; diesel 17.93 to 18.33; CNG 17.76 to 21.15; EV 2.55 to 4.61; hybrid 2.32 to 2.64.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#292d29}.label{font-size:14px}.small{font-size:11px;fill:#687169}.value{font-size:13px;font-weight:600}</style><rect width="720" height="340" fill="#fff"/><text x="0" y="22" font-size="15" font-weight="600">New passenger-vehicle sales by fuel</text><text x="0" y="44" class="small">India · share of annual sales, not existing fleet</text><text x="310" y="75" class="small">2024</text><text x="510" y="75" class="small">2025</text><g transform="translate(0 90)"><text y="15" class="label">Petrol</text><rect x="180" width="297.2" height="22" rx="2" fill="#dce4df"/><rect x="500" width="106.54" height="22" rx="2" fill="#52776b"/><text x="180" y="39" class="small">59.44%</text><text x="500" y="39" class="small">53.27%</text><text y="75" class="label">Diesel</text><rect x="180" y="59" width="89.65" height="22" rx="2" fill="#dce4df"/><rect x="500" y="59" width="36.66" height="22" rx="2" fill="#52776b"/><text x="180" y="98" class="small">17.93%</text><text x="500" y="98" class="small">18.33%</text><text y="134" class="label">CNG</text><rect x="180" y="118" width="88.8" height="22" rx="2" fill="#dce4df"/><rect x="500" y="118" width="42.3" height="22" rx="2" fill="#52776b"/><text x="180" y="157" class="small">17.76%</text><text x="500" y="157" class="small">21.15%</text><text y="193" class="label">EV</text><rect x="180" y="177" width="12.75" height="22" rx="2" fill="#dce4df"/><rect x="500" y="177" width="9.22" height="22" rx="2" fill="#52776b"/><text x="180" y="216" class="small">2.55%</text><text x="500" y="216" class="small">4.61%</text></g><text x="0" y="329" class="small">Hybrid: 2.32% in 2024 and 2.64% in 2025. Source: Autocar India, 4 January 2026.</text></svg>